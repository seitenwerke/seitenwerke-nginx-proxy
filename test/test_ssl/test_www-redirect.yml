services:
  # HTTPS_METHOD=redirect (default)
  web2:
    image: web
    expose:
      - "82"
    environment:
      WEB_PORTS: "82"
      VIRTUAL_HOST: "web2.nginx-proxy.tld,www.web2.nginx-proxy.tld"

  # HTTPS_METHOD=noredirect
  web3:
    image: web
    expose:
      - "83"
    environment:
      WEB_PORTS: "83"
      VIRTUAL_HOST: "web3.nginx-proxy.tld,www.web3.nginx-proxy.tld"
      HTTPS_METHOD: noredirect

  # HTTPS_METHOD=nohttps, with a VIRTUAL_PATH
  web4:
    image: web
    expose:
      - "84"
    environment:
      WEB_PORTS: "84"
      VIRTUAL_HOST: "web4.nginx-proxy.tld,www.web4.nginx-proxy.tld"
      VIRTUAL_PATH: "/web4/"
      VIRTUAL_DEST: "/"
      HTTPS_METHOD: nohttps

  # www redirect disabled by label
  web5:
    image: web
    expose:
      - "85"
    environment:
      WEB_PORTS: "85"
      VIRTUAL_HOST: "www.nginx-proxy.tld"
    labels:
      com.github.nginx-proxy.nginx-proxy.www-redirect: "false"
